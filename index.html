<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>AI 竞赛刷题</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
--bg:#f6f7f9; --card:#fff; --ink:#14171c; --dim:#5d6673; --faint:#8b95a3;
--line:#e3e7ec; --line2:#eef1f4;
--accent:#1f6feb; --accent-soft:#e8f0fe;
--ok:#0f8a4d; --ok-soft:#e6f5ec; --bad:#c8362b; --bad-soft:#fdecea;
--warn:#a8620a; --warn-soft:#fdf3e3;
--radius:14px; --sh:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
}
:root:not([data-theme=light]) { }
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
--bg:#0f1115; --card:#171a20; --ink:#e8eaee; --dim:#a0a8b4; --faint:#727b88;
--line:#262b33; --line2:#1f242b;
--accent:#4d90f0; --accent-soft:#16233a;
--ok:#3ec27f; --ok-soft:#12271c; --bad:#f0705f; --bad-soft:#2b1614;
--warn:#e0a353; --warn-soft:#2a2013;
--sh:0 1px 2px rgba(0,0,0,.3);
}}
[data-theme=dark]{
--bg:#0f1115; --card:#171a20; --ink:#e8eaee; --dim:#a0a8b4; --faint:#727b88;
--line:#262b33; --line2:#1f242b;
--accent:#4d90f0; --accent-soft:#16233a;
--ok:#3ec27f; --ok-soft:#12271c; --bad:#f0705f; --bad-soft:#2b1614;
--warn:#e0a353; --warn-soft:#2a2013;
--sh:0 1px 2px rgba(0,0,0,.3);
}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);
font:16px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
padding-bottom:calc(64px + env(safe-area-inset-bottom));overscroll-behavior-y:none}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:var(--accent)}

/* top bar */
header{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--line);
padding-top:env(safe-area-inset-top)}
.hbar{max-width:760px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:10px;min-height:52px}
.htitle{font-size:16px;font-weight:650;letter-spacing:-.01em;flex:1;min-width:0;
overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbtn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--dim);flex:none}
.hbtn:active{background:var(--line2)}
.hbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.prog{height:3px;background:var(--line2)}
.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}

/* generic */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--sh)}
.sec{margin:18px 0 8px;font-size:12.5px;font-weight:650;color:var(--faint);letter-spacing:.06em}
.muted{color:var(--dim)}
.tiny{font-size:12.5px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;
background:var(--line2);color:var(--dim);white-space:nowrap}
.pill.a{background:var(--accent-soft);color:var(--accent)}
.pill.g{background:var(--ok-soft);color:var(--ok)}
.pill.r{background:var(--bad-soft);color:var(--bad)}
.pill.w{background:var(--warn-soft);color:var(--warn)}

/* home */
.bank{display:block;width:100%;text-align:left;padding:16px;margin-bottom:10px}
.bank h3{font-size:17px;font-weight:650;margin-bottom:3px}
.bar{height:6px;background:var(--line2);border-radius:99px;overflow:hidden;margin-top:11px;display:flex}
.bar i{display:block;height:100%}
.bar .b-ok{background:var(--ok)}.bar .b-bad{background:var(--bad)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.mode{padding:14px;text-align:left}
.mode b{display:block;font-size:15px;font-weight:640;margin-bottom:2px}
.mode span{font-size:12.5px;color:var(--dim);line-height:1.45}
.mode:active{border-color:var(--accent)}
.mode[disabled]{opacity:.45}

/* chapters */
.ch{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;border-bottom:1px solid var(--line2);text-align:left}
.ch:last-child{border-bottom:none}
.ch:active{background:var(--line2)}
.ch-n{font-size:13px;color:var(--faint);font-variant-numeric:tabular-nums;flex:none}
.minibar{width:52px;height:5px;border-radius:99px;background:var(--line2);overflow:hidden;flex:none;display:flex}

/* question */
.qmeta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:11px}
.qtext{font-size:17.5px;line-height:1.6;font-weight:560;letter-spacing:-.003em;margin-bottom:15px}
.opt{display:flex;gap:11px;width:100%;text-align:left;padding:13px 14px;margin-bottom:8px;
background:var(--card);border:1.5px solid var(--line);border-radius:12px;transition:border-color .12s,background .12s}
.opt:active{border-color:var(--accent)}
.opt .k{flex:none;width:24px;height:24px;border-radius:7px;background:var(--line2);color:var(--dim);
font-size:12.5px;font-weight:700;display:grid;place-items:center;margin-top:1px}
.opt .v{flex:1;font-size:15.5px;line-height:1.55}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .k{background:var(--accent);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .k{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .k{background:var(--bad);color:#fff}
.opt.miss{border-color:var(--ok);border-style:dashed}
.trap{background:var(--warn-soft);color:var(--warn);border-radius:3px;padding:0 2px;font-weight:600}
.verdict{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:650;margin:14px 0 9px}
.exp{padding:13px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;
font-size:14.5px;line-height:1.68;color:var(--dim)}
.exp b{color:var(--ink)}
.errata{padding:11px 13px;background:var(--warn-soft);border:1px solid var(--warn);border-radius:11px;
font-size:13.5px;line-height:1.6;color:var(--warn);margin-bottom:11px}
.src{margin-top:10px;font-size:12.5px;color:var(--faint);word-break:break-all}

/* bottom action bar */
.fab{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--card);
border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.fab-in{max-width:760px;margin:0 auto;display:flex;gap:9px;align-items:center}
.btn{flex:1;padding:13px;border-radius:12px;font-size:16px;font-weight:640;text-align:center;
background:var(--accent);color:#fff}
.btn:active{filter:brightness(.92)}
.btn.ghost{flex:none;padding:13px 15px;background:var(--line2);color:var(--dim)}
.btn[disabled]{opacity:.4}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:55;background:var(--card);border-top:1px solid var(--line);
display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;
font-size:10.5px;color:var(--faint);font-weight:560}
nav button.on{color:var(--accent)}
nav svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* stats */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}
.kpi{padding:13px 10px;text-align:center}
.kpi b{display:block;font-size:23px;font-weight:680;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi span{font-size:11.5px;color:var(--faint)}

/* result */
.big{font-size:46px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:1.1}
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.sq{aspect-ratio:1;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:620;
background:var(--line2);color:var(--dim);font-variant-numeric:tabular-nums}
.sq.ok{background:var(--ok-soft);color:var(--ok)}
.sq.bad{background:var(--bad-soft);color:var(--bad)}
.sq.cur{outline:2px solid var(--accent);outline-offset:1px}

.list-in{padding:13px 14px;border-bottom:1px solid var(--line2);width:100%;text-align:left;display:flex;gap:10px}
.list-in:last-child{border-bottom:none}
.list-in:active{background:var(--line2)}
input[type=search],input[type=number]{width:100%;padding:11px 13px;border-radius:11px;border:1px solid var(--line);
background:var(--card);color:var(--ink);font-size:15px}
input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.sw{width:46px;height:27px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .15s}
.sw i{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;
box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.sw.on{background:var(--accent)}.sw.on i{transform:translateX(19px)}
#gate{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;
align-items:center;justify-content:center;padding:24px}
#gate .box{width:100%;max-width:340px;text-align:center}
#gate h1{font-size:20px;font-weight:680;letter-spacing:-.01em;margin-bottom:6px}
#gate p{font-size:13.5px;color:var(--dim);line-height:1.6;margin-bottom:22px}
#gate input{text-align:center;font-size:19px;letter-spacing:.14em;padding:14px;font-weight:600}
#gate .btn{margin-top:11px;width:100%}
#gate .err{color:var(--bad);font-size:13.5px;margin-top:11px;min-height:20px}
#gate .lock{font-size:34px;margin-bottom:12px;opacity:.5}
.hide{display:none!important}
[hidden]{display:none!important}
@media(min-width:640px){.modes{grid-template-columns:repeat(3,1fr)}.qtext{font-size:19px}}
</style>
</head>
<body>
<header><div class="hbar">
  <button class="hbtn" id="back" hidden><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
  <div class="htitle" id="htitle">AI 应用竞赛 · 刷题</div>
  <button class="hbtn" id="star" hidden><svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.5 6.1.9-4.4 4.3 1 6-5.4-2.8-5.4 2.8 1-6L3.2 9.4l6.1-.9z"/></svg></button>
  <button class="hbtn" id="themebtn"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg></button>
</div><div class="prog"><i id="progbar" style="width:0"></i></div></header>
<div id="gate"><div class="box">
  <div class="lock">🔒</div>
  <h1>AI 竞赛刷题</h1>
  <p>题库已加密。输入口令解锁，本机记住后不再询问。</p>
  <input type="password" id="pw" inputmode="text" autocomplete="current-password" placeholder="口令" enterkeyhint="go">
  <button class="btn" id="unlock">解锁</button>
  <div class="err" id="gerr"></div>
</div></div>
<main class="wrap" id="app"></main>
<div class="fab hide" id="fab"><div class="fab-in" id="fabin"></div></div>
<nav id="nav"></nav>

/* ============ 状态 ============ */
const LS='hd-ai-quiz-v1';
const D={t:'d',hi:{},star:{},set:{trap:1,auto:1},theme:''};
let S=Object.assign({},D);
try{const r=JSON.parse(localStorage.getItem(LS)||'{}');S=Object.assign({},D,r);
    S.hi=r.hi||{};S.star=r.star||{};S.set=Object.assign({},D.set,r.set||{});}catch(e){}
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}};
let DATA=null, BK={}, TRAP=null;
const KEY=['A','B','C','D','E','F'];
const id=(b,n)=>b+n;
const H=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mark=s=>S.set.trap? H(s).replace(TRAP,'<span class="trap">$1</span>') : H(s);
const rec=(b,n)=>S.hi[id(b,n)]||null;            // {r:对次, w:错次, l:最后一次是否对}
const isWrong=(b,n)=>{const h=rec(b,n);return h&&h.l===0};
const isDone =(b,n)=>!!rec(b,n);
const chapters=b=>{const m=new Map();BK[b].qs.forEach(q=>{if(!m.has(q.c))m.set(q.c,[]);m.get(q.c).push(q.n)});return m};

/* ============ 视图路由 ============ */
let V={p:'home'};        // p: home|chap|quiz|result|wrong|stats|set|search
let Q=null;              // 当前练习会话
const app=document.getElementById('app'), fab=document.getElementById('fab'),
      fabin=document.getElementById('fabin'), navEl=document.getElementById('nav'),
      hTitle=document.getElementById('htitle'), bBack=document.getElementById('back'),
      bStar=document.getElementById('star'), pBar=document.getElementById('progbar');

function go(p,o){V=Object.assign({p:p},o||{});window.scrollTo(0,0);render()}
document.getElementById('themebtn').onclick=()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const nx=cur==='dark'?'light':cur==='light'?'':'dark';
  S.theme=nx;applyTheme();save();};
function applyTheme(){const r=document.documentElement;
  if(S.theme)r.setAttribute('data-theme',S.theme);else r.removeAttribute('data-theme');}
applyTheme();
bBack.onclick=()=>{ if(V.p==='quiz'&&Q&&Q.mode==='exam'&&!Q.done){ if(!confirm('退出模拟考？本次成绩不保存。'))return; }
  go(V.p==='chap'?'home':V.p==='quiz'?(V.from||'home'):'home'); };

/* ============ 首页 ============ */
function vHome(){
  hTitle.textContent='AI 应用竞赛 · 刷题';bBack.hidden=true;bStar.hidden=true;fab.classList.add('hide');pBar.style.width='0';
  let h='';
  h+='<div class="sec">选择题库</div>';
  DATA.banks.forEach(b=>{
    const t=b.qs.length;let ok=0,bad=0,done=0;
    b.qs.forEach(q=>{const r=rec(b.id,q.n);if(r){done++;r.l?ok++:bad++}});
    h+=`<button class="card bank" data-bank="${b.id}">
      <div class="row"><h3 class="grow">${b.name}</h3><span class="pill${done===t?' g':''}">${done}/${t}</span></div>
      <div class="tiny muted">单选 ${b.qs.filter(q=>q.t===0).length} · 多选 ${b.qs.filter(q=>q.t===1).length}${b.id==='z'?' · 与大众版重题 53':''}</div>
      <div class="bar"><i class="b-ok" style="width:${ok/t*100}%"></i><i class="b-bad" style="width:${bad/t*100}%"></i></div>
      <div class="row tiny muted" style="margin-top:7px">
        <span class="grow">已对 ${ok} · 待纠 ${bad}</span>
        <span>${done?Math.round(ok/done*100):0}% 正确</span></div></button>`;});
  const b=S.t,B=BK[b];
  const undone=B.qs.filter(q=>!isDone(b,q.n)).length, wrongN=B.qs.filter(q=>isWrong(b,q.n)).length;
  const starN=B.qs.filter(q=>S.star[id(b,q.n)]).length;
  h+=`<div class="sec">练习 · 当前：${B.name}</div><div class="modes">
   <button class="card mode" data-go="seq"><b>顺序刷</b><span>从第 1 题按序推进</span></button>
   <button class="card mode" data-go="undone" ${undone?'':'disabled'}><b>只刷没做过</b><span>剩 ${undone} 题</span></button>
   <button class="card mode" data-go="rand"><b>随机抽</b><span>打乱顺序练手感</span></button>
   <button class="card mode" data-go="chap"><b>按章节</b><span>分知识块攻克</span></button>
   <button class="card mode" data-go="wrong" ${wrongN?'':'disabled'}><b>错题本</b><span>${wrongN} 题待消灭</span></button>
   <button class="card mode" data-go="starm" ${starN?'':'disabled'}><b>收藏</b><span>${starN} 题已标记</span></button>
   <button class="card mode" data-go="exam"><b>模拟考</b><span>100 题计时闭卷</span></button>
   <button class="card mode" data-go="jump"><b>跳转 / 搜索</b><span>按题号或关键词</span></button>
   </div>`;
  h+=`<div class="sec">答题心法（核验题库后总结）</div><div class="card" style="padding:14px">
   <div style="font-size:14.5px;line-height:1.7">${DATA.txt.tips}</div></div>`;
  h+=`<div class="card" style="padding:13px;margin-top:12px"><div class="tiny muted">${DATA.txt.verified}</div></div>`;
  app.innerHTML=h;
  app.querySelectorAll('[data-bank]').forEach(el=>el.onclick=()=>{S.t=el.dataset.bank;save();render()});
  app.querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>{
    const g=el.dataset.go;
    if(g==='chap')return go('chap');
    if(g==='jump')return go('search');
    start(g);});
}

/* ============ 章节 ============ */
function vChap(){
  const b=S.t;hTitle.textContent='按章节 · '+BK[b].short;bBack.hidden=false;bStar.hidden=true;fab.classList.add('hide');pBar.style.width='0';
  const m=chapters(b);let h='<div class="card" style="overflow:hidden;margin-top:14px">';
  [...m.entries()].sort((a,c)=>c[1].length-a[1].length).forEach(([name,ns])=>{
    let ok=0,bad=0;ns.forEach(n=>{const r=rec(b,n);if(r)r.l?ok++:bad++});
    const t=ns.length;
    h+=`<button class="ch" data-c="${H(name)}"><span class="grow">${H(name)}</span>
      <span class="minibar"><i style="width:${ok/t*100}%;background:var(--ok)"></i><i style="width:${bad/t*100}%;background:var(--bad)"></i></span>
      <span class="ch-n">${ok+bad}/${t}</span></button>`;});
  h+='</div>';app.innerHTML=h;
  app.querySelectorAll('[data-c]').forEach(el=>el.onclick=()=>start('chap',el.dataset.c));
}

/* ============ 搜索 ============ */
function vSearch(){
  hTitle.textContent='跳转 / 搜索';bBack.hidden=false;bStar.hidden=true;fab.classList.add('hide');pBar.style.width='0';
  app.innerHTML=`<div style="margin-top:14px"><input type="search" id="sq" placeholder="题号（如 231）或关键词（如 PIPL、LoRA）" autocomplete="off"></div><div id="sr"></div>`;
  const inp=document.getElementById('sq'),out=document.getElementById('sr');
  const run=()=>{const v=inp.value.trim();if(!v){out.innerHTML='';return}
    const b=S.t,B=BK[b];let hit;
    if(/^\d+$/.test(v)){const n=+v;hit=B.qs.filter(q=>q.n===n)}
    else{const k=v.toLowerCase();hit=B.qs.filter(q=>(q.q+q.o.join('')+q.e).toLowerCase().includes(k))}
    out.innerHTML=`<div class="sec">${BK[b].short}版 · ${hit.length} 条</div>`+
      (hit.length?'<div class="card" style="overflow:hidden">'+hit.slice(0,80).map(q=>
        `<button class="list-in" data-n="${q.n}"><span class="ch-n">${q.n}</span><span class="grow" style="font-size:14.5px">${H(q.q.slice(0,52))}</span></button>`).join('')+'</div>':'<div class="card" style="padding:14px" class="muted">没找到</div>');
    out.querySelectorAll('[data-n]').forEach(el=>el.onclick=()=>{
      const n=+el.dataset.n;Q={b:S.t,list:BK[S.t].qs.map(q=>q.n),i:BK[S.t].qs.findIndex(q=>q.n===n),
        mode:'seq',ans:{},title:'跳转 · '+BK[S.t].short};V.from='search';go('quiz')});};
  inp.oninput=run;setTimeout(()=>inp.focus(),60);
}

/* ============ 开始一组练习 ============ */
function start(mode,arg){
  const b=S.t,B=BK[b];let list,title;
  const all=B.qs.map(q=>q.n);
  if(mode==='seq'){list=all;title='顺序刷 · '+B.short;}
  else if(mode==='undone'){list=all.filter(n=>!isDone(b,n));title='未做 · '+B.short;}
  else if(mode==='rand'){list=shuffle(all.slice());title='随机 · '+B.short;}
  else if(mode==='wrong'){list=all.filter(n=>isWrong(b,n));title='错题本 · '+B.short;}
  else if(mode==='starm'){list=all.filter(n=>S.star[id(b,n)]);title='收藏 · '+B.short;}
  else if(mode==='chap'){list=B.qs.filter(q=>q.c===arg).map(q=>q.n);title=arg;}
  else if(mode==='exam'){list=shuffle(all.slice()).slice(0,100);title='模拟考 · '+B.short;}
  if(!list.length)return alert('这一组没有题目');
  Q={b:b,list:list,i:0,mode:mode,ans:{},title:title,
     t0:mode==='exam'?Date.now():0,done:false};
  V.from=mode==='chap'?'chap':'home';go('quiz');
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}

/* ============ 答题 ============ */
function curQ(){return BK[Q.b].qs.find(q=>q.n===Q.list[Q.i])}
function vQuiz(){
  const q=curQ(),b=Q.b,k=id(b,q.n),st=Q.ans[q.n];
  const exam=Q.mode==='exam';
  hTitle.textContent=`${Q.title} · ${Q.i+1}/${Q.list.length}`;
  bBack.hidden=false;bStar.hidden=false;
  bStar.style.color=S.star[k]?'var(--warn)':'var(--dim)';
  bStar.querySelector('path').setAttribute('fill',S.star[k]?'currentColor':'none');
  bStar.onclick=()=>{S.star[k]=!S.star[k];save();vQuiz()};
  pBar.style.width=((Q.i+1)/Q.list.length*100)+'%';

  const shown=st&&st.sub;
  const sel=st?st.sel:[];
  let h='';
  if(exam&&!Q.done)h+=`<div class="row tiny muted" style="margin:12px 0 0"><span class="grow">闭卷模式 · 交卷后统一看解析</span><span id="clk" style="font-variant-numeric:tabular-nums"></span></div>`;
  h+='<div style="margin-top:14px"><div class="qmeta">';
  h+=`<span class="pill a">${q.t?'多选':'单选'}</span><span class="pill">${H(q.c)}</span><span class="pill">#${q.n}</span>`;
  if(q.dup)h+=`<span class="pill w">与大众版 #${q.dup} 重题</span>`;
  const r=rec(b,q.n);if(r&&!exam)h+=`<span class="pill ${r.l?'g':'r'}">做过 ${r.r+r.w} 次 · ${r.l?'上次对':'上次错'}</span>`;
  h+='</div>';
  h+=`<div class="qtext">${H(q.q)}</div>`;
  q.o.forEach((o,i)=>{
    let cls='opt';
    if(shown){ const isA=q.a.includes(i),isS=sel.includes(i);
      if(isA&&isS)cls+=' ok'; else if(isS)cls+=' bad'; else if(isA)cls+=' miss'; }
    else if(sel.includes(i))cls+=' sel';
    h+=`<button class="${cls}" data-i="${i}"><span class="k">${KEY[i]}</span><span class="v">${shown?mark(o):H(o)}</span></button>`;});
  if(shown){
    const right=eq(sel,q.a);
    h+=`<div class="verdict" style="color:var(--${right?'ok':'bad'})">${right?'✓ 答对':'✗ 答错'}
        <span class="tiny muted" style="font-weight:400">正确答案：${q.a.map(i=>KEY[i]).join('、')}</span></div>`;
    const er=DATA.errata[b+q.n];
    if(er)h+=`<div class="errata"><b>⚠ 本题勘误</b><br>${H(er)}</div>`;
    h+=`<div class="exp"><b>解析</b>　${H(q.e)}`;
    if(q.s)h+=`<div class="src">来源：${H(q.s)}${q.u?` · <a href="${H(q.u)}" target="_blank" rel="noopener">原文</a>`:''}</div>`;
    h+='</div>';
  }
  h+='</div>';
  app.innerHTML=h;
  app.querySelectorAll('[data-i]').forEach(el=>el.onclick=()=>pick(+el.dataset.i));

  // 底部操作条
  fab.classList.remove('hide');
  const last=Q.i===Q.list.length-1;
  let f='';
  if(exam&&!Q.done){
    f=`<button class="btn ghost" id="prev" ${Q.i?'':'disabled'}>上一题</button>
       <button class="btn" id="next">${last?'交卷':'下一题'}</button>`;
  } else if(!shown){
    f=`<button class="btn ghost" id="prev" ${Q.i?'':'disabled'}>上一题</button>
       <button class="btn" id="sub" ${sel.length?'':'disabled'}>确认${q.t?`（已选 ${sel.length}）`:''}</button>`;
  } else {
    f=`<button class="btn ghost" id="prev" ${Q.i?'':'disabled'}>上一题</button>
       <button class="btn" id="next">${last?'完成':'下一题'}</button>`;
  }
  fabin.innerHTML=f;
  const P=document.getElementById('prev');if(P)P.onclick=()=>{Q.i--;vQuiz();window.scrollTo(0,0)};
  const N=document.getElementById('next');if(N)N.onclick=nextQ;
  const SB=document.getElementById('sub');if(SB)SB.onclick=submit;
  if(exam&&!Q.done)tick();
}
function eq(a,c){return a.length===c.length&&a.every(x=>c.includes(x))}
function pick(i){
  const q=curQ(),st=Q.ans[q.n]||{sel:[],sub:false};
  if(st.sub)return;
  if(q.t===0){ st.sel=[i]; Q.ans[q.n]=st;
    if(Q.mode==='exam'){vQuiz();return}
    if(S.set.auto){submit();return} }
  else { st.sel=st.sel.includes(i)?st.sel.filter(x=>x!==i):st.sel.concat(i).sort((a,b)=>a-b); Q.ans[q.n]=st; }
  vQuiz();
}
function submit(){
  const q=curQ(),st=Q.ans[q.n];if(!st||!st.sel.length)return;
  st.sub=true;
  const right=eq(st.sel,q.a),k=id(Q.b,q.n),h=S.hi[k]||{r:0,w:0,l:1};
  right?h.r++:h.w++; h.l=right?1:0; S.hi[k]=h;
  if(right&&h.r>=2&&h.w>0){} // 保留错题记录，靠 l 判定
  save();vQuiz();
}
function nextQ(){
  if(Q.i===Q.list.length-1){
    if(Q.mode==='exam'&&!Q.done){finishExam();return}
    go('result');return;}
  Q.i++;vQuiz();window.scrollTo(0,0);
}
function finishExam(){
  Q.done=true;Q.t1=Date.now();
  Object.keys(Q.ans).forEach(n=>{const q=BK[Q.b].qs.find(x=>x.n===+n),st=Q.ans[n];
    st.sub=true;const right=eq(st.sel,q.a),k=id(Q.b,q.n),h=S.hi[k]||{r:0,w:0,l:1};
    right?h.r++:h.w++;h.l=right?1:0;S.hi[k]=h;});
  save();go('result');
}
let clkT=null;
function tick(){clearInterval(clkT);const el=document.getElementById('clk');if(!el)return;
  const up=()=>{const s=(Date.now()-Q.t0)/1000|0;const e=document.getElementById('clk');
    if(!e){clearInterval(clkT);return}e.textContent=`${(s/60|0)}:${String(s%60).padStart(2,'0')}`};
  up();clkT=setInterval(up,1000);}

/* ============ 结果 ============ */
function vResult(){
  hTitle.textContent='本组结果';bBack.hidden=false;bStar.hidden=true;fab.classList.add('hide');pBar.style.width='100%';
  clearInterval(clkT);
  const B=BK[Q.b];let ok=0,bad=0,skip=0;
  const rows=Q.list.map(n=>{const q=B.qs.find(x=>x.n===n),st=Q.ans[n];
    if(!st||!st.sub){skip++;return{n,s:'-'}}
    const r=eq(st.sel,q.a);r?ok++:bad++;return{n,s:r?'ok':'bad'}});
  const ans=ok+bad,pct=ans?Math.round(ok/ans*100):0;
  let h=`<div class="card" style="padding:20px;margin-top:14px;text-align:center">
    <div class="big" style="color:var(--${pct>=85?'ok':pct>=60?'warn':'bad'})">${pct}<span style="font-size:22px">%</span></div>
    <div class="muted tiny" style="margin-top:4px">答对 ${ok} · 答错 ${bad}${skip?` · 未答 ${skip}`:''}`;
  if(Q.mode==='exam'&&Q.t1){const s=(Q.t1-Q.t0)/1000|0;h+=` · 用时 ${(s/60|0)} 分 ${s%60} 秒`}
  h+=`</div></div>`;
  if(Q.mode==='exam')h+=`<div class="card" style="padding:13px;margin-top:10px"><div class="tiny muted">
    ${pct>=90?'这个水平进前 30 基本稳。把错题过一遍就行。':pct>=75?'及格线以上，但前 30 是排名制——把错题本清空再考一次。':'离稳进前 30 还有距离，优先按章节补短板，别急着再模考。'}</div></div>`;
  h+=`<div class="sec">答题卡（点击回看）</div><div class="card" style="padding:12px"><div class="sheet">`+
    rows.map((r,i)=>`<div class="sq ${r.s==='ok'?'ok':r.s==='bad'?'bad':''}" data-i="${i}">${r.n}</div>`).join('')+'</div></div>';
  h+=`<div class="modes" style="margin-top:14px">
    <button class="card mode" id="rew" ${bad?'':'disabled'}><b>只看错题</b><span>${bad} 题</span></button>
    <button class="card mode" id="again"><b>再来一组</b><span>回首页选模式</span></button></div>`;
  app.innerHTML=h;
  app.querySelectorAll('[data-i]').forEach(el=>el.onclick=()=>{Q.i=+el.dataset.i;Q.done=Q.mode==='exam'?true:Q.done;go('quiz')});
  const rw=document.getElementById('rew');
  if(rw)rw.onclick=()=>{const bad=rows.filter(r=>r.s==='bad').map(r=>r.n);
    if(!bad.length)return;Q={b:Q.b,list:bad,i:0,mode:'wrong',ans:{},title:'本组错题'};V.from='home';go('quiz')};
  document.getElementById('again').onclick=()=>go('home');
}

/* ============ 错题本 ============ */
function vWrong(){
  hTitle.textContent='错题本';bBack.hidden=true;bStar.hidden=true;fab.classList.add('hide');pBar.style.width='0';
  let h='';
  DATA.banks.forEach(B=>{
    const ws=B.qs.filter(q=>isWrong(B.id,q.n));
    h+=`<div class="sec">${B.name} · ${ws.length} 题</div>`;
    if(!ws.length){h+='<div class="card" style="padding:16px" class="muted"><span class="muted tiny">这个库暂时没有错题</span></div>';return}
    h+=`<button class="card" id="go_${B.id}" style="padding:13px;width:100%;text-align:center;color:var(--accent);font-weight:640;margin-bottom:9px">开始消灭这 ${ws.length} 题</button>`;
    h+='<div class="card" style="overflow:hidden">'+ws.slice(0,60).map(q=>{const r=rec(B.id,q.n);
      return `<button class="list-in" data-b="${B.id}" data-n="${q.n}">
        <span class="ch-n">${q.n}</span><span class="grow" style="font-size:14.5px">${H(q.q.slice(0,50))}</span>
        <span class="pill r">错${r.w}</span></button>`}).join('')+
      (ws.length>60?`<div class="list-in tiny muted">还有 ${ws.length-60} 题…</div>`:'')+'</div>';});
  app.innerHTML=h;
  DATA.banks.forEach(B=>{const el=document.getElementById('go_'+B.id);
    if(el)el.onclick=()=>{S.t=B.id;save();start('wrong')}});
  app.querySelectorAll('[data-n]').forEach(el=>el.onclick=()=>{
    const b=el.dataset.b,n=+el.dataset.n;S.t=b;save();
    const ws=BK[b].qs.filter(q=>isWrong(b,q.n)).map(q=>q.n);
    Q={b:b,list:ws,i:ws.indexOf(n),mode:'wrong',ans:{},title:'错题本 · '+BK[b].short};V.from='wrong';go('quiz')});
}

/* ============ 统计 ============ */
function vStats(){
  hTitle.textContent='统计';bBack.hidden=true;bStar.hidden=true;fab.classList.add('hide');pBar.style.width='0';
  let tot=0,done=0,ok=0,bad=0;
  DATA.banks.forEach(B=>B.qs.forEach(q=>{tot++;const r=rec(B.id,q.n);if(r){done++;r.l?ok++:bad++}}));
  let h=`<div class="kpis" style="margin-top:14px">
    <div class="card kpi"><b>${done}</b><span>已做 / ${tot}</span></div>
    <div class="card kpi"><b style="color:var(--ok)">${done?Math.round(ok/done*100):0}%</b><span>掌握率</span></div>
    <div class="card kpi"><b style="color:var(--bad)">${bad}</b><span>待纠错题</span></div></div>`;
  DATA.banks.forEach(B=>{
    const m=chapters(B.id);h+=`<div class="sec">${B.name} · 章节掌握度</div><div class="card" style="overflow:hidden">`;
    [...m.entries()].map(([name,ns])=>{
      let o=0,x=0;ns.forEach(n=>{const r=rec(B.id,n);if(r)r.l?o++:x++});
      return{name,t:ns.length,o,x,p:ns.length?o/ns.length:0};})
    .sort((a,c)=>a.p-c.p).forEach(c=>{
      h+=`<div class="ch"><span class="grow">${H(c.name)}</span>
        <span class="minibar"><i style="width:${c.o/c.t*100}%;background:var(--ok)"></i><i style="width:${c.x/c.t*100}%;background:var(--bad)"></i></span>
        <span class="ch-n">${Math.round(c.p*100)}%</span></div>`;});
    h+='</div>';});
  h+=`<div class="sec">题库体检</div><div class="card" style="padding:14px"><div class="tiny muted" style="line-height:1.75">${DATA.txt.health}</div></div>`;
  app.innerHTML=h;
}

/* ============ 设置 ============ */
function vSet(){
  hTitle.textContent='设置';bBack.hidden=true;bStar.hidden=true;fab.classList.add('hide');pBar.style.width='0';
  const sw=(k,on,t,d)=>`<button class="list-in" data-sw="${k}"><span class="grow"><b style="font-weight:600">${t}</b>
    <div class="tiny muted">${d}</div></span><span class="sw ${on?'on':''}"><i></i></span></button>`;
  app.innerHTML=`<div class="sec">答题</div><div class="card" style="overflow:hidden">
   ${sw('trap',S.set.trap,'高亮陷阱词','在解析阶段把「无需 / 必然 / 只要…就」等固定错误话术标黄')}
   ${sw('auto',S.set.auto,'单选自动提交','选中即判定，刷题更快；多选仍需点确认')}
   </div>
   <div class="sec">数据</div><div class="card" style="overflow:hidden">
   <button class="list-in" id="exp"><span class="grow"><b style="font-weight:600">导出进度</b>
     <div class="tiny muted">存成 json 文件，换手机时可导回</div></span></button>
   <button class="list-in" id="imp"><span class="grow"><b style="font-weight:600">导入进度</b>
     <div class="tiny muted">从 json 文件恢复</div></span></button>
   <button class="list-in" id="clr"><span class="grow" style="color:var(--bad)"><b style="font-weight:600">清空全部记录</b>
     <div class="tiny muted">不可恢复</div></span></button></div>
   <div class="sec">关于</div><div class="card" style="padding:14px"><div class="tiny muted" style="line-height:1.75">${DATA.txt.about}</div></div>
   <input type="file" id="fi" accept="application/json" class="hide">`;
  app.querySelectorAll('[data-sw]').forEach(el=>el.onclick=()=>{
    const k=el.dataset.sw;S.set[k]=!S.set[k];save();vSet()});
  document.getElementById('exp').onclick=()=>{
    const blob=new Blob([JSON.stringify({hi:S.hi,star:S.star})],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download='ai-quiz-progress.json';a.click();};
  const fi=document.getElementById('fi');
  document.getElementById('imp').onclick=()=>fi.click();
  fi.onchange=()=>{const f=fi.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{const j=JSON.parse(r.result);S.hi=j.hi||{};S.star=j.star||{};save();alert('已导入');render()}
      catch(e){alert('文件格式不对')}};r.readAsText(f)};
  document.getElementById('clr').onclick=()=>{if(confirm('清空所有做题记录和收藏？不可恢复。')){
    S.hi={};S.star={};save();render()}};
}

 ['wrong','错题','M12 8v5M12 16.5v.5M10.3 3.9L2.4 17.5a1.8 1.8 0 001.6 2.7h16a1.8 1.8 0 001.6-2.7L13.7 3.9a1.8 1.8 0 00-3.4 0z'],
 ['stats','统计','M4 20V10M10 20V4M16 20v-7M22 20H2'],
 ['set','设置','M12 15.5a3.5 3.5 0 100-7 3.5 3.5 0 000 7zM19.4 15a1.6 1.6 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.6 1.6 0 00-2.7 1.1v.2a2 2 0 11-4 0v-.1A1.6 1.6 0 006 19.4l-.1.1a2 2 0 11-2.8-2.8l.1-.1A1.6 1.6 0 002.6 14H2.4a2 2 0 110-4h.1A1.6 1.6 0 004.6 6l-.1-.1a2 2 0 112.8-2.8l.1.1A1.6 1.6 0 0010 2.6V2.4a2 2 0 114 0v.1a1.6 1.6 0 002.7 1.1l.1-.1a2 2 0 112.8 2.8l-.1.1a1.6 1.6 0 001.1 2.7h.2a2 2 0 110 4h-.1a1.6 1.6 0 00-1.3.9z']];
function vNav(){
  const on=['home','chap','search'].includes(V.p)?'home':V.p;
  navEl.innerHTML=NAV.map(([k,t,d])=>

/* ============ 渲染 ============ */
function render(){
  const hideNav=(V.p==='quiz'||V.p==='result');
  navEl.classList.toggle('hide',hideNav);
  document.body.style.paddingBottom=hideNav?'calc(78px + env(safe-area-inset-bottom))':'calc(64px + env(safe-area-inset-bottom))';
  ({home:vHome,chap:vChap,quiz:vQuiz,result:vResult,wrong:vWrong,stats:vStats,set:vSet,search:vSearch}[V.p]||vHome)();
  if(!hideNav)vNav();
}
document.addEventListener('keydown',e=>{
  if(V.p!=='quiz')return;
  const q=curQ();
  if(/^[1-6]$/.test(e.key)){const i=+e.key-1;if(i<q.o.length)pick(i)}
  else if(e.key==='Enter'){const st=Q.ans[q.n];
    if(st&&st.sub||Q.mode==='exam')nextQ();else if(st&&st.sel.length)submit();}
  else if(e.key==='ArrowRight')nextQ();
  else if(e.key==='ArrowLeft'&&Q.i){Q.i--;vQuiz()}});

/* ============ 口令门 ============ */
const gate=document.getElementById('gate'), pw=document.getElementById('pw'),
      gerr=document.getElementById('gerr'), ubtn=document.getElementById('unlock');
const b64d=s=>{const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u};
async function decrypt(pass){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(ENC.s),iterations:150000,hash:'SHA-256'},
    km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(ENC.i)},key,b64d(ENC.c));
  return JSON.parse(new TextDecoder().decode(pt));
}
function boot(d){
  DATA=d; DATA.banks.forEach(b=>BK[b.id]=b);
  TRAP=new RegExp('('+DATA.traps.join('|')+')','g');
  gate.remove(); render();
}
async function tryUnlock(pass,silent){
  if(!pass)return false;
  if(!silent){ubtn.textContent='解锁中…';gerr.textContent=''}
  try{ const d=await decrypt(pass);
       try{localStorage.setItem('hd-ai-quiz-pw',pass)}catch(e){}
       boot(d); return true; }
  catch(e){ if(!silent){ubtn.textContent='解锁';gerr.textContent='口令不对';pw.select()} return false }
}
ubtn.onclick=()=>tryUnlock(pw.value.trim());
pw.addEventListener('keydown',e=>{if(e.key==='Enter')tryUnlock(pw.value.trim())});
(async()=>{
  if(!crypto.subtle){gerr.textContent='此浏览器不支持解密（需 HTTPS 访问）';return}
  let saved=null; try{saved=localStorage.getItem('hd-ai-quiz-pw')}catch(e){}
  if(saved && await tryUnlock(saved,true)) return;
  setTimeout(()=>pw.focus(),120);
})();
